[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marklogic-tool"
version = "0.0.3"
description = "CLI to query, verify, deploy and destroy MarkLogic Server configuration via the REST and Management APIs"
readme = "README.md"
authors = [
  {name = "Vlad Korolev", email = "vlad@v-lad.org"}
]
license = "MIT"
keywords = [
  "marklogic",
  "rest-api",
  "cli",
  "database",
  "xquery"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Database",
  "Environment :: Console"
]
requires-python = ">=3.13"
dependencies = [
  "typer>=0.12",
  "httpx",
  "pydantic>=2.0",
  "rich>=13.0",
  "structlog>=24.0",
  "sentry-sdk>=2.0",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML"
]

[project.scripts]
marklogic-tool = "marklogic_tool.cli:main"

[project.urls]
Homepage = "https://github.com/vladistan/marklogic-tool"
Repository = "https://github.com/vladistan/marklogic-tool"
Issues = "https://github.com/vladistan/marklogic-tool/issues"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod"
]

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__about__.py"
]

[tool.hatch.build.targets.sdist]
# A published sdist must carry no internal material. This is the guard that was
# missing when web-search-tool 0.1.1 shipped plans/ and PUB_MANIFEST.md and had to
# be deleted from PyPI.
#
# tests/live and its guard test are excluded rather than scrubbed: FORBIDDEN_HOSTS
# names production so live tests cannot select it, and that literal must stay
# literal. Excluding the files keeps the guard fully armed in-repo while shipping
# none of it. test_live_tier_guard.py goes with it because it imports
# tests.live.conftest and asserts its contents — shipping it without tests/live
# would ship an ImportError.
#
# test_charter.py and test_acceptance_brief_tally.py are excluded for the same reason one
# step further out: they assert REPOSITORY invariants, reading PUB_MANIFEST.md and
# plans/briefs/ACCEPTANCE-6.5.md. Both must never ship, so these two can never pass in a
# published package - they would fail on a user's machine for a reason that is none of
# their business. They stay in the repo because they are load-bearing there: one keeps the
# charter identical across all six sites, the other keeps the acceptance brief from
# disagreeing with its own checkboxes.
#
# coverage.xml is excluded because it SHIPPED. It is git-ignored, but hatchling does not
# consult .gitignore for the sdist, so a locally generated coverage report was packaged and
# carried absolute /home/<user>/ paths into the artifact. Found by building the sdist and
# scanning its contents rather than by reasoning about what ought to be in it.
exclude = [
  "/plans",
  "/PUB_MANIFEST.md",
  "/tests/live",
  "/tests/test_live_tier_guard.py",
  "/tests/test_charter.py",
  "/tests/test_acceptance_brief_tally.py",
  "/coverage.xml"
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-m",
  "not integration",
  "--cov=marklogic_tool",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=80"
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "live: talks to a real MarkLogic server; guarded by tests/live/conftest.py, which ABORTS the run on a forbidden or unnamed host"
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "ARG",
  "SIM",
  "TCH"
]
ignore = [
  "E501",
  "B008",
  "ARG001",
  "ARG002"
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["marklogic_tool"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG", "S101"]
